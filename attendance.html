<!DOCTYPE html>
<html>
<head>
   
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Attendance Calculator - StudentCalc Hub</title>

    <meta name="description" content="Free attendance calculator for students. Calculate your attendance percentage, classes you can miss, and classes needed to reach 75%.">

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            text-align: center;
            padding: 40px;
        }

        .calculator {
            background: white;
            max-width: 400px;
            margin: auto;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 10px;
            font-size: 16px;
        }

        button {
            padding: 12px 25px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #1d4ed8;
        }

      #result {
    margin-top: 20px;
    padding: 20px;
    border-radius: 12px;
    font-size: 18px;
    display: none;
    transition: background-color 0.5s ease;
}

.result-content {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
}

.result-text {
    text-align: left;
}

.result-emoji {
    font-size: 65px;
    min-width: 85px;
    text-align: center;
}

/* Happy */
.emoji-happy {
    animation: bounce 1.2s infinite ease-in-out;
}

/* Smug */
.emoji-smug {
    animation: smug 1.5s infinite ease-in-out;
}

/* Sigma */
.emoji-sigma {
    animation: sigma 1.3s infinite ease-in-out;
}

/* Worried */
.emoji-worried {
    animation: worried 0.6s infinite ease-in-out;
}

/* Depressed */
.emoji-depressed {
    animation: depressed 2s infinite ease-in-out;
}

/* Crying */
.emoji-crying {
    animation: crying 0.5s infinite ease-in-out;
}


/* Animations */

@keyframes bounce {

    0%, 100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-10px);
    }

}


@keyframes smug {

    0%, 100% {
        transform: translateX(0) rotate(0deg);
    }

    50% {
        transform: translateX(8px) rotate(5deg);
    }

}


@keyframes sigma {

    0%, 100% {
        transform: scale(1) rotate(0deg);
    }

    50% {
        transform: scale(1.15) rotate(5deg);
    }

}


@keyframes worried {

    0%, 100% {
        transform: translateX(0);
    }

    25% {
        transform: translateX(-5px);
    }

    75% {
        transform: translateX(5px);
    }

}


@keyframes depressed {

    0%, 100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(6px);
    }

}


@keyframes crying {

    0%, 100% {
        transform: translateX(0) rotate(0deg);
    }

    25% {
        transform: translateX(-7px) rotate(-5deg);
    }

    75% {
        transform: translateX(7px) rotate(5deg);
    }

}

        a {
            display: block;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <div class="calculator">

        <h1>📊 Attendance Calculator</h1>

        <p>Calculate your attendance percentage</p>

        <input type="number" id="conducted" placeholder="Classes Conducted">

        <input type="number" id="attended" placeholder="Classes Attended">

        <br>

       <button onclick="calculateAttendance()">Calculate</button>
<button onclick="clearCalculator()">Clear</button>
        <div id="result"></div>

        <a href="index.html">← Back to StudentCalc Hub</a>

    </div>


<script>

 function calculateAttendance() {

    let conducted = Number(document.getElementById("conducted").value);
    let attended = Number(document.getElementById("attended").value);

    let resultBox = document.getElementById("result");

    if (conducted <= 0 || attended < 0 || attended > conducted) {

        resultBox.style.display = "block";
        resultBox.style.backgroundColor = "#ffcccc";

        resultBox.innerHTML =
            "❌ Please enter valid values.";

        return;
    }

    let percentage = (attended / conducted) * 100;

    let emoji;
    let emojiClass;
    let backgroundColor;


    /* 90% and above */

    if (percentage >= 90) {

        emoji = "🗿";
        emojiClass = "emoji-sigma";

        let strength = Math.min((percentage - 90) / 10, 1);

        let red = Math.round(70 - strength * 30);
        let green = Math.round(190 + strength * 35);

        backgroundColor = `rgb(${red}, ${green}, 120)`;
    }


    /* 80% - 89.99% */

    else if (percentage >= 80) {

        emoji = "😏";
        emojiClass = "emoji-smug";

        let strength = (percentage - 80) / 10;

        let red = Math.round(110 - strength * 40);
        let green = Math.round(190 + strength * 25);

        backgroundColor = `rgb(${red}, ${green}, 120)`;
    }


    /* 75% - 79.99% */

    else if (percentage >= 75) {

        emoji = "🙂";
        emojiClass = "emoji-happy";

        let strength = (percentage - 75) / 5;

        let red = Math.round(150 - strength * 40);
        let green = Math.round(200 + strength * 15);

        backgroundColor = `rgb(${red}, ${green}, 120)`;
    }


    /* 70% - 74.99% */

    else if (percentage >= 70) {

        emoji = "😟";
        emojiClass = "emoji-worried";

        let strength = (percentage - 70) / 5;

        let red = Math.round(255 - strength * 20);
        let green = Math.round(170 - strength * 30);

        backgroundColor = `rgb(${red}, ${green}, 120)`;
    }


    /* 60% - 69.99% */

    else if (percentage >= 60) {

        emoji = "😞";
        emojiClass = "emoji-depressed";

        let strength = (percentage - 60) / 10;

        let red = Math.round(220 + strength * 35);
        let green = Math.round(70 - strength * 20);

        backgroundColor = `rgb(${red}, ${green}, 100)`;
    }


    /* Below 60% */

    else {

        emoji = "😭";
        emojiClass = "emoji-crying";

        backgroundColor = "rgb(180, 40, 70)";
    }


    let result = `

        <div class="result-content">

            <div class="result-text">

                Your attendance is:
                <b>${percentage.toFixed(2)}%</b>

                <br><br>
    `;


    if (percentage >= 75) {
let canMiss = Math.floor(
    (attended - 0.75 * conducted) / 0.75
);

        result +=
            "You can miss <b>" +
            canMiss +
            "</b> more class(es) and stay at 75%.";

    }

    else {

        let needToAttend = Math.ceil(
            (0.75 * conducted - attended) / 0.25
        );

        result +=
            "You need to attend <b>" +
            needToAttend +
            "</b> consecutive class(es) to reach 75%.";

    }


    result += `

            </div>

            <div class="result-emoji ${emojiClass}">
                ${emoji}
            </div>

        </div>

    `;


    resultBox.innerHTML = result;

    resultBox.style.display = "block";

    resultBox.style.backgroundColor = backgroundColor;
}
    function clearCalculator() {

    document.getElementById("conducted").value = "";
    document.getElementById("attended").value = "";

    let resultBox = document.getElementById("result");

    resultBox.innerHTML = "";
    resultBox.style.display = "none";
}

</script>

</body>
</html>
