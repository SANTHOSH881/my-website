<!DOCTYPE html>
<html>
<head>
    <title>SGPA Calculator - StudentCalc Hub</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            text-align: center;
            padding: 40px;
        }

        .calculator {
            background: white;
            max-width: 600px;
            margin: auto;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        select,
        input {
            padding: 10px;
            margin: 5px;
            font-size: 15px;
        }

        button {
            padding: 12px 20px;
            margin: 10px 5px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            background-color: #1d4ed8;
        }

        .subject {
            margin: 15px 0;
            padding: 10px;
            background-color: #f4f6f8;
            border-radius: 8px;
        }

        #result {
            margin-top: 20px;
            padding: 15px;
            background-color: #dbeafe;
            border-radius: 8px;
            font-size: 20px;
            display: none;
        }

        a {
            display: block;
            margin-top: 20px;
        }

    </style>
</head>

<body>

    <div class="calculator">

        <h1>🎓 SGPA Calculator</h1>

        <p>Calculate your Semester Grade Point Average</p>

        <br>

        <label>Select Semester:</label>

        <select id="semester">

            <option value="1">1st Semester</option>
            <option value="2">2nd Semester</option>
            <option value="3">3rd Semester</option>
            <option value="4">4th Semester</option>
            <option value="5">5th Semester</option>
            <option value="6">6th Semester</option>
            <option value="7">7th Semester</option>
            <option value="8">8th Semester</option>

        </select>

        <div id="subjects"></div>

        <button onclick="addSubject()">➕ Add Subject</button>

        <br>

        <button onclick="calculateSGPA()">Calculate SGPA</button>

        <button onclick="clearCalculator()">Clear</button>

        <div id="result"></div>

        <a href="index.html">← Back to StudentCalc Hub</a>

    </div>


<script>

let subjectCount = 0;


function addSubject() {

    subjectCount++;

    let subjects = document.getElementById("subjects");

    let subject = document.createElement("div");

    subject.className = "subject";

    subject.innerHTML = `

        <label>Subject ${subjectCount}</label>

        <br>

        <input
            type="text"
            class="subject-name"
            placeholder="Subject Name"
        >

        <select class="grade">

            <option value="10">O - 10</option>
            <option value="9">A+ - 9</option>
            <option value="8">A - 8</option>
            <option value="7">B+ - 7</option>
            <option value="6">B - 6</option>
            <option value="5">C - 5</option>
            <option value="4">D - 4</option>
            <option value="0">F - 0</option>

        </select>

        <input
            type="number"
            class="credits"
            placeholder="Credits"
            min="1"
        >

    `;

    subjects.appendChild(subject);
}


function calculateSGPA() {

    let grades = document.querySelectorAll(".grade");
    let credits = document.querySelectorAll(".credits");

    let totalPoints = 0;
    let totalCredits = 0;

    if (grades.length === 0) {

        alert("Please add at least one subject.");
        return;
    }

    for (let i = 0; i < grades.length; i++) {

        let grade = Number(grades[i].value);
        let credit = Number(credits[i].value);

        if (credit <= 0) {

            alert("Please enter valid credits for all subjects.");
            return;
        }

        totalPoints += grade * credit;
        totalCredits += credit;
    }

    let sgpa = totalPoints / totalCredits;


    /* Variables for result */

    let emoji;
    let emojiClass;
    let title;
    let message;
    let backgroundColor;


    /* 9.5 - 10 */

    if (sgpa >= 9.5) {

        emoji = "🗿";
        emojiClass = "emoji-legendary";
        title = "LEGENDARY";
        message = "You're built different. Absolute academic sigma!";

        backgroundColor = "#70d68c";
    }


    /* 9.0 - 9.49 */

    else if (sgpa >= 9.0) {

        emoji = "🔥";
        emojiClass = "emoji-beast";
        title = "BEAST MODE";
        message = "That's an insane SGPA. Keep destroying those exams!";

        backgroundColor = "#8fdb7a";
    }


    /* 8.0 - 8.99 */

    else if (sgpa >= 8.0) {

        emoji = "😏";
        emojiClass = "emoji-confident";
        title = "VERY CONFIDENT";
        message = "You're doing seriously well!";

        backgroundColor = "#a8df85";
    }


    /* 7.0 - 7.99 */

    else if (sgpa >= 7.0) {

        emoji = "😎";
        emojiClass = "emoji-good";
        title = "DOING GOOD";
        message = "Solid performance. Keep pushing!";

        backgroundColor = "#c0e69a";
    }


    /* 6.0 - 6.99 */

    else if (sgpa >= 6.0) {

        emoji = "🙂";
        emojiClass = "emoji-okay";
        title = "DECENT";
        message = "Not bad! There's still room to level up.";

        backgroundColor = "#e3e59b";
    }


    /* 5.0 - 5.99 */

    else if (sgpa >= 5.0) {

        emoji = "😐";
        emojiClass = "emoji-improve";
        title = "NEEDS IMPROVEMENT";
        message = "Time to put in a little more effort.";

        backgroundColor = "#f0c77a";
    }


    /* 4.0 - 4.99 */

    else if (sgpa >= 4.0) {

        emoji = "😟";
        emojiClass = "emoji-danger";
        title = "DANGER ZONE";
        message = "Careful! Your next semester needs attention.";

        backgroundColor = "#ed9270";
    }


    /* Below 4 */

    else {

        emoji = "💀";
        emojiClass = "emoji-failed";
        title = "ACADEMIC DAMAGE";
        message = "Bro... we need to talk about your study plan 💀";

        backgroundColor = "#d95c68";
    }


    let result = `

        <div class="result-content">

            <div class="result-text">

                Your SGPA is:
                <b>${sgpa.toFixed(2)}</b>

                <br><br>

                <strong>${title}</strong>

                <br><br>

                ${message}

            </div>


            <div class="result-emoji ${emojiClass}">
                ${emoji}
            </div>

        </div>

    `;


    let resultBox = document.getElementById("result");

    resultBox.innerHTML = result;

    resultBox.style.display = "block";

    resultBox.style.backgroundColor = backgroundColor;
}


function clearCalculator() {

    document.getElementById("subjects").innerHTML = "";

    document.getElementById("result").innerHTML = "";

    document.getElementById("result").style.display = "none";

    subjectCount = 0;

}

</script>

</body>
</html>
