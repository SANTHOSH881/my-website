<!DOCTYPE html>
<html>
<head>
    <title>SGPA Calculator - StudentCalc Hub</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            text-align: center;
            padding: 40px;
        }

        .calculator {
            background: white;
            max-width: 600px;
            margin: auto;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        select,
        input {
            padding: 10px;
            margin: 5px;
            font-size: 15px;
        }

        button {
            padding: 12px 20px;
            margin: 10px 5px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            background-color: #1d4ed8;
        }

        .subject {
            margin: 15px 0;
            padding: 10px;
            background-color: #f4f6f8;
            border-radius: 8px;
        }

        #result {
            margin-top: 20px;
            padding: 15px;
            background-color: #dbeafe;
            border-radius: 8px;
            font-size: 20px;
            display: none;
        }

        a {
            display: block;
            margin-top: 20px;
        }

    </style>
</head>

<body>

    <div class="calculator">

        <h1>🎓 SGPA Calculator</h1>

        <p>Calculate your Semester Grade Point Average</p>

        <br>

        <label>Select Semester:</label>

        <select id="semester">

            <option value="1">1st Semester</option>
            <option value="2">2nd Semester</option>
            <option value="3">3rd Semester</option>
            <option value="4">4th Semester</option>
            <option value="5">5th Semester</option>
            <option value="6">6th Semester</option>
            <option value="7">7th Semester</option>
            <option value="8">8th Semester</option>

        </select>

        <div id="subjects"></div>

        <button onclick="addSubject()">➕ Add Subject</button>

        <br>

        <button onclick="calculateSGPA()">Calculate SGPA</button>

        <button onclick="clearCalculator()">Clear</button>

        <div id="result"></div>

        <a href="index.html">← Back to StudentCalc Hub</a>

    </div>


<script>

let subjectCount = 0;


function addSubject() {

    subjectCount++;

    let subjects = document.getElementById("subjects");

    let subject = document.createElement("div");

    subject.className = "subject";

    subject.innerHTML = `

        <label>Subject ${subjectCount}</label>

        <br>

        <select class="grade">

            <option value="10">O - 10</option>
            <option value="9">A+ - 9</option>
            <option value="8">A - 8</option>
            <option value="7">B+ - 7</option>
            <option value="6">B - 6</option>
            <option value="5">C - 5</option>
            <option value="4">D - 4</option>
            <option value="0">F - 0</option>

        </select>

        <input
            type="number"
            class="credits"
            placeholder="Credits"
            min="1"
        >

    `;

    subjects.appendChild(subject);
}


function calculateSGPA() {

    let grades = document.querySelectorAll(".grade");

    let credits = document.querySelectorAll(".credits");

    let totalPoints = 0;

    let totalCredits = 0;


    if (grades.length === 0) {

        alert("Please add at least one subject.");

        return;
    }


    for (let i = 0; i < grades.length; i++) {

        let grade = Number(grades[i].value);

        let credit = Number(credits[i].value);


        if (credit <= 0) {

            alert("Please enter valid credits for all subjects.");

            return;
        }


        totalPoints += grade * credit;

        totalCredits += credit;

    }


    let sgpa = totalPoints / totalCredits;


    let result = document.getElementById("result");

    result.innerHTML =
        "Your SGPA is: <b>" +
        sgpa.toFixed(2) +
        "</b>";

    result.style.display = "block";

}


function clearCalculator() {

    document.getElementById("subjects").innerHTML = "";

    document.getElementById("result").innerHTML = "";

    document.getElementById("result").style.display = "none";

    subjectCount = 0;

}

</script>

</body>
</html>
