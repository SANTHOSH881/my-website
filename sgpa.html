<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SGPA Calculator - StudentCalc Hub</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            margin: 0;
            padding: 30px;
        }

        .calculator {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .description {
            text-align: center;
            margin-bottom: 30px;
        }

        .semester {
            margin-bottom: 25px;
        }

        select,
        input {
            padding: 10px;
            font-size: 15px;
            width: 100%;
            margin-top: 5px;
        }

        .subject {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
            align-items: end;
        }

        .subject label {
            font-size: 14px;
        }

        button {
            padding: 11px 20px;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            font-size: 15px;
        }

        .add-btn {
            background: #16a34a;
            color: white;
            margin-top: 10px;
        }

        .calculate-btn {
            background: #2563eb;
            color: white;
            margin-top: 20px;
        }

        .clear-btn {
            background: #dc2626;
            color: white;
            margin-top: 20px;
            margin-left: 10px;
        }

        #result {
            text-align: center;
            font-size: 22px;
            margin-top: 25px;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 25px;
        }

        @media (max-width: 600px) {

            .subject {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>

<body>

<div class="calculator">

    <h1>🎓 SGPA Calculator</h1>

    <p class="description">
        Calculate your Semester Grade Point Average
    </p>


    <div class="semester">

        <label><b>Select Semester</b></label>

        <select id="semester">

            <option>1st Semester</option>
            <option>2nd Semester</option>
            <option>3rd Semester</option>
            <option>4th Semester</option>
            <option>5th Semester</option>
            <option>6th Semester</option>
            <option>7th Semester</option>
            <option>8th Semester</option>

        </select>

    </div>


    <h3>Subjects</h3>

    <div id="subjects">


        <div class="subject">

            <div>
                <label>Subject</label>

                <select class="subject-name">

                    <option>Mathematics</option>
                    <option>Physics</option>
                    <option>Chemistry</option>
                    <option>Programming</option>
                    <option>Python</option>
                    <option>Java</option>
                    <option>Data Structures</option>
                    <option>Database Management Systems</option>
                    <option>Computer Networks</option>
                    <option>Operating Systems</option>
                    <option>Artificial Intelligence</option>
                    <option>Machine Learning</option>
                    <option>Deep Learning</option>
                    <option>Software Engineering</option>
                    <option>Web Technologies</option>
                    <option>Computer Organization</option>
                    <option>Discrete Mathematics</option>
                    <option>Statistics</option>
                    <option>English</option>
                    <option>Environmental Science</option>
                    <option>Custom Subject</option>

                </select>

            </div>


            <div>

                <label>Credits</label>

                <input
                    type="number"
                    class="credits"
                    min="1"
                    max="10"
                    placeholder="Credits">

            </div>


            <div>

                <label>Grade</label>

                <select class="grade">

                    <option value="10">O / 10</option>
                    <option value="9">A+ / 9</option>
                    <option value="8">A / 8</option>
                    <option value="7">B+ / 7</option>
                    <option value="6">B / 6</option>
                    <option value="5">C / 5</option>
                    <option value="4">D / 4</option>
                    <option value="0">F / 0</option>

                </select>

            </div>

        </div>


    </div>


    <button class="add-btn" onclick="addSubject()">
        + Add Subject
    </button>

    <br>

    <button class="calculate-btn" onclick="calculateSGPA()">
        Calculate SGPA
    </button>

    <button class="clear-btn" onclick="clearCalculator()">
        Clear
    </button>


    <div id="result"></div>


    <a class="back" href="index.html">
        ← Back to StudentCalc Hub
    </a>

</div>


<script>

function addSubject() {

    let subjects = document.getElementById("subjects");

    let subject = document.createElement("div");

    subject.className = "subject";

    subject.innerHTML = `

        <div>

            <label>Subject</label>

            <select class="subject-name">

                <option>Mathematics</option>
                <option>Physics</option>
                <option>Chemistry</option>
                <option>Programming</option>
                <option>Python</option>
                <option>Java</option>
                <option>Data Structures</option>
                <option>Database Management Systems</option>
                <option>Computer Networks</option>
                <option>Operating Systems</option>
                <option>Artificial Intelligence</option>
                <option>Machine Learning</option>
                <option>Deep Learning</option>
                <option>Software Engineering</option>
                <option>Web Technologies</option>
                <option>Computer Organization</option>
                <option>Discrete Mathematics</option>
                <option>Statistics</option>
                <option>English</option>
                <option>Environmental Science</option>
                <option>Custom Subject</option>

            </select>

        </div>


        <div>

            <label>Credits</label>

            <input
                type="number"
                class="credits"
                min="1"
                max="10"
                placeholder="Credits">

        </div>


        <div>

            <label>Grade</label>

            <select class="grade">

                <option value="10">O / 10</option>
                <option value="9">A+ / 9</option>
                <option value="8">A / 8</option>
                <option value="7">B+ / 7</option>
                <option value="6">B / 6</option>
                <option value="5">C / 5</option>
                <option value="4">D / 4</option>
                <option value="0">F / 0</option>

            </select>

        </div>

    `;

    subjects.appendChild(subject);

}


function calculateSGPA() {

    let credits = document.querySelectorAll(".credits");
    let grades = document.querySelectorAll(".grade");

    let totalCredits = 0;
    let totalPoints = 0;

    for (let i = 0; i < credits.length; i++) {

        let credit = Number(credits[i].value);
        let grade = Number(grades[i].value);

        if (credit <= 0) {

            document.getElementById("result").innerHTML =
                "❌ Please enter credits for every subject.";

            return;
        }

        totalCredits += credit;

        totalPoints += credit * grade;

    }


    let sgpa = totalPoints / totalCredits;


    document.getElementById("result").innerHTML =
        "Your SGPA is: <b>" + sgpa.toFixed(2) + "</b>";

}


function clearCalculator() {

    location.reload();

}

</script>

</body>

</html>
